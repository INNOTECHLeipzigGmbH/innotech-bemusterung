<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bemusterungsliste – INNOTECH</title>
<style>
:root {
  --surface-1:      #fcfcfb;
  --page-plane:     #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --gridline:       #e1e0d9;
  --border:         rgba(11,11,11,0.10);
  --series-1:       #2a78d6;
  --series-1-dark:  #184f95;
  --status-good:      #0ca30c;
  --status-warning:   #d97706;
  --status-critical:  #d03b3b;
  --status-fixiert:   #374151;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page-plane); color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px;
}
a { color: var(--series-1); }
header {
  background: var(--surface-1); border-bottom: 1px solid var(--border);
  padding: 14px 22px; display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px; position: sticky; top: 0; z-index: 50;
}
header h1 { font-size: 17px; margin: 0; }
.proj-label { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.hbtn { border-radius: 6px; padding: 7px 13px; font-size: 12.5px; cursor: pointer; font-weight: 600; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); font-family: inherit; text-decoration: none; display: inline-block; }
.hbtn:hover { border-color: var(--series-1); color: var(--series-1); }
.hbtn-blue { background: var(--series-1); border-color: var(--series-1); color: #fff; }
.hbtn-blue:hover { background: var(--series-1-dark); color: #fff; }

main { max-width: 1180px; margin: 0 auto; padding: 20px 20px 60px; }
#error-banner { max-width: 760px; margin: 60px auto; background: var(--surface-1); border: 1px solid var(--status-critical); border-radius: 10px; padding: 20px 24px; color: var(--text-secondary); line-height: 1.6; }
#error-banner h2 { margin: 0 0 8px; font-size: 16px; color: var(--status-critical); }
#error-banner code { background: var(--page-plane); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }

.kpi-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.kpi-tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; min-width: 108px; }
.kpi-value { font-size: 21px; font-weight: 700; }
.kpi-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.kpi-tile.k-freigegeben .kpi-value { color: var(--status-good); }
.kpi-tile.k-nicht_freigegeben .kpi-value { color: var(--status-critical); }
.kpi-tile.k-alternative .kpi-value { color: var(--status-warning); }
.kpi-tile.k-fixiert .kpi-value { color: var(--status-fixiert); }

.toolbar { margin-bottom: 16px; }
.add-raumtyp-form { display: flex; gap: 8px; align-items: center; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.add-raumtyp-form input { flex: 1; min-width: 200px; font: inherit; font-size: 13px; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--page-plane); color: var(--text-primary); }

.raumtyp-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
.raumtyp-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--gridline); flex-wrap: wrap; }
.raumtyp-head.collapsed { border-bottom: none; }
.raumtyp-caret { cursor: pointer; font-size: 12px; color: var(--text-muted); width: 14px; text-align: center; flex-shrink: 0; }
.raumtyp-name-input { font-size: 15px; font-weight: 700; border: 1px solid transparent; border-radius: 6px; padding: 4px 7px; background: transparent; color: var(--text-primary); font-family: inherit; min-width: 160px; }
.raumtyp-name-input:hover, .raumtyp-name-input:focus { border-color: var(--border); background: var(--page-plane); outline: none; }
.raumtyp-count { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.raumtyp-delete { margin-left: auto; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 13px; }
.raumtyp-delete:hover { color: var(--status-critical); }
.raeume-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 0 16px 12px; }
.raeume-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); margin-right: 2px; }
.raum-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; background: var(--page-plane); border: 1px solid var(--border); border-radius: 999px; padding: 3px 6px 3px 10px; white-space: nowrap; }
.raum-chip button { border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 11px; padding: 0; line-height: 1; }
.raum-chip button:hover { color: var(--status-critical); }
.raum-add-input { font: inherit; font-size: 12px; padding: 4px 8px; border-radius: 999px; border: 1px dashed var(--border); background: transparent; width: 120px; }
.raum-add-input:focus { outline: none; border-color: var(--series-1); background: var(--surface-1); }

.elemente-body { padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.elemente-body.collapsed { display: none; }
.element-row { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--page-plane); display: flex; flex-direction: column; gap: 7px; }
.element-row.is-neu-status-freigegeben { border-color: color-mix(in srgb, var(--status-good) 45%, var(--border)); }
.element-row.is-neu-status-nicht_freigegeben { border-color: color-mix(in srgb, var(--status-critical) 45%, var(--border)); }
.element-row.is-neu-status-alternative { border-color: color-mix(in srgb, var(--status-warning) 45%, var(--border)); }
.element-row.is-neu-status-fixiert { border-color: color-mix(in srgb, var(--status-fixiert) 45%, var(--border)); }
.el-row1 { display: flex; align-items: center; gap: 8px; }
.el-name-input { flex: 1; font: inherit; font-size: 13.5px; font-weight: 700; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); }
.el-remove-btn { border: 1px solid var(--border); background: transparent; color: var(--text-muted); border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer; }
.el-remove-btn:hover { color: var(--status-critical); border-color: var(--status-critical); }
.el-row2 { display: flex; gap: 7px; flex-wrap: wrap; }
.el-row2 input { flex: 1; min-width: 130px; font: inherit; font-size: 12.5px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); }
.el-bemerkung-input { width: 100%; font: inherit; font-size: 12.5px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); }
.el-links-row, .el-anh-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.el-mini-label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); margin-right: 2px; flex-shrink: 0; }
.el-link-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; background: var(--surface-1); color: var(--series-1-dark); text-decoration: none; max-width: 240px; }
.el-link-chip span.txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.el-link-chip button, .el-anh-chip button { border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 11px; padding: 0 0 0 2px; line-height: 1; }
.el-link-chip button:hover, .el-anh-chip button:hover { color: var(--status-critical); }
.el-link-add-input { font: inherit; font-size: 11.5px; padding: 4px 7px; border-radius: 6px; border: 1px dashed var(--border); background: transparent; width: 190px; }
.el-link-add-input:focus { outline: none; border-color: var(--series-1); background: var(--surface-1); }
.el-anh-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; background: var(--surface-1); color: var(--text-secondary); text-decoration: none; max-width: 240px; }
.el-anh-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.el-anh-chip .size { color: var(--text-muted); flex-shrink: 0; }
.el-attach-btn, .el-link-btn { border: 1px dashed var(--border); background: transparent; color: var(--text-muted); border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
.el-attach-btn:hover, .el-link-btn:hover { border-color: var(--series-1); color: var(--series-1-dark); }
.el-attach-btn.uploading { opacity: .6; cursor: wait; }
.el-pdf-pending-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; border: 1px dashed var(--status-warning); border-radius: 6px; padding: 3px 7px; background: color-mix(in srgb, var(--status-warning) 10%, var(--surface-1)); color: var(--status-warning); max-width: 260px; }
.el-pdf-pending-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: italic; }
.el-pdf-pending-chip button { border: none; background: transparent; color: inherit; cursor: pointer; font-size: 11px; padding: 0 0 0 2px; line-height: 1; opacity: .75; }
.el-pdf-pending-chip button:hover { opacity: 1; }
.el-row-status { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.el-status-select { font: inherit; font-size: 12px; font-weight: 600; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); }
.el-status-select.s-offen { color: var(--text-muted); }
.el-status-select.s-freigegeben { color: var(--status-good); border-color: color-mix(in srgb, var(--status-good) 45%, var(--border)); }
.el-status-select.s-nicht_freigegeben { color: var(--status-critical); border-color: color-mix(in srgb, var(--status-critical) 45%, var(--border)); }
.el-status-select.s-alternative { color: var(--status-warning); border-color: color-mix(in srgb, var(--status-warning) 45%, var(--border)); }
.el-status-select.s-fixiert { color: var(--status-fixiert); border-color: color-mix(in srgb, var(--status-fixiert) 45%, var(--border)); font-weight: 700; }
.el-status-notiz { flex: 1; min-width: 160px; font: inherit; font-size: 12px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); }
.add-element-btn { align-self: flex-start; border: 1px dashed var(--border); background: transparent; color: var(--text-muted); border-radius: 6px; padding: 5px 11px; font-size: 12px; cursor: pointer; }
.add-element-btn:hover { border-color: var(--series-1); color: var(--series-1-dark); }
.empty-hint { font-size: 12.5px; color: var(--text-muted); font-style: italic; padding: 6px 0; }

.el-layout { display: flex; gap: 12px; align-items: flex-start; }
.el-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.el-bild-box { width: 132px; flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; }
.el-bild-thumb { width: 132px; height: 132px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-1); display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--text-muted); font-size: 11px; text-align: center; padding: 4px; }
.el-bild-thumb img { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; display: block; }
.el-bild-btns { display: flex; flex-direction: column; gap: 4px; }
.el-bild-btns button { border: 1px dashed var(--border); background: transparent; color: var(--text-muted); border-radius: 6px; padding: 3px 6px; font-size: 11px; cursor: pointer; font-family: inherit; }
.el-bild-btns button:hover { border-color: var(--series-1); color: var(--series-1-dark); }
.el-bild-btns button.danger:hover { border-color: var(--status-critical); color: var(--status-critical); }
.el-bild-btns button:disabled { opacity: .6; cursor: wait; }
@media (max-width: 640px) { .el-layout { flex-direction: column; } }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--surface-1); border-radius: 10px; max-width: 96vw; max-height: 94vh; display: flex; flex-direction: column; overflow: hidden; min-width: min(420px, 96vw); }
.modal-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--gridline); flex-wrap: wrap; }
.modal-head h3 { margin: 0; font-size: 14px; margin-right: auto; }
.modal-body { padding: 12px 14px; overflow: auto; flex: 1; }
.modal-foot { padding: 10px 14px; border-top: 1px solid var(--gridline); display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.modal select, .modal .pg { font: inherit; font-size: 12.5px; padding: 4px 7px; border-radius: 6px; border: 1px solid var(--border); background: var(--page-plane); }
.crop-wrap { position: relative; display: inline-block; cursor: crosshair; user-select: none; touch-action: none; }
.crop-wrap canvas { display: block; max-width: 100%; }
.crop-sel { position: absolute; border: 2px solid var(--series-1); background: rgba(42,120,214,.15); pointer-events: none; }
.crop-hint { font-size: 12px; color: var(--text-secondary); margin-right: auto; }
.lightbox img { max-width: 92vw; max-height: 90vh; background: #fff; border-radius: 6px; }

#print-area { display: none; }
.hbtn-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pf-group { margin-bottom: 14px; }
.pf-group h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); }
.pf-checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.pf-checks label { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; }
.pf-links { font-size: 11.5px; margin-left: 8px; font-weight: 400; text-transform: none; letter-spacing: 0; }
.pf-links a { cursor: pointer; }
.pf-count { margin-right: auto; font-size: 12.5px; color: var(--text-secondary); }
.pr-title { font-size: 16pt; font-weight: 700; margin: 0 0 2pt; }
.pr-sub { font-size: 9.5pt; color: #444; margin-bottom: 10pt; }
.pr-sec { margin-bottom: 12pt; }
.pr-sec h2 { font-size: 11.5pt; margin: 0 0 4pt; padding-bottom: 2pt; border-bottom: 1.5pt solid #222; break-after: avoid; }
.pr-sec h2 small { font-weight: 400; color: #555; font-size: 9pt; margin-left: 6pt; }
.pr-tbl { width: 100%; border-collapse: collapse; font-size: 9pt; }
.pr-tbl th { text-align: left; font-size: 8pt; text-transform: uppercase; color: #555; border-bottom: 0.75pt solid #999; padding: 3pt 4pt; }
.pr-tbl td { vertical-align: top; padding: 4pt; border-bottom: 0.5pt solid #ccc; }
.pr-tbl tr { break-inside: avoid; }
.pr-img { width: 70pt; height: 70pt; object-fit: contain; border: 0.5pt solid #ccc; display: block; }
.pr-noimg { width: 70pt; height: 30pt; color: #aaa; font-size: 8pt; }
.pr-st { font-weight: 700; white-space: nowrap; }
.pr-st.s-freigegeben { color: #0a7a0a; } .pr-st.s-nicht_freigegeben { color: #b32d2d; }
.pr-st.s-alternative { color: #b45f06; } .pr-st.s-fixiert { color: #374151; } .pr-st.s-offen { color: #777; }
.pr-small { color: #555; font-size: 8pt; }
@page { size: A4 landscape; margin: 12mm; }
@media print {
  body.printing > *:not(#print-area) { display: none !important; }
  body.printing #print-area { display: block !important; }
  body.printing { background: #fff; color: #000; }
}
</style>
</head>
<body>

<header>
  <div>
    <h1>📋 Bemusterungsliste</h1>
    <div class="proj-label" id="proj-label">Lade Projekt …</div>
  </div>
  <div class="hbtn-row">
    <button class="hbtn" id="print-btn" type="button">🖨 Drucken …</button>
    <a class="hbtn" href="https://innotechleipziggmbh.github.io/Kaufland-Status/" target="_blank">↗ Dashboard</a>
  </div>
</header>

<div id="error-banner" hidden></div>

<div id="print-area"></div>

<main id="app" hidden>
  <div class="kpi-row" id="kpi-row"></div>

  <div class="toolbar">
    <button class="hbtn hbtn-blue" id="show-add-raumtyp-btn" type="button">+ Raumtyp anlegen</button>
    <div id="add-raumtyp-form-holder"></div>
  </div>

  <div id="raumtypen-list"></div>
</main>

<script>
const SUPABASE_URL = "https://beszfzvxtfwdzimixdbo.supabase.co";
const SUPABASE_KEY = "sb_publishable_onY7q5GNCGOxkEuzEOySDA_XyIqR6Rw";
const HEADERS = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" };
const KAUF_REST = `${SUPABASE_URL}/rest/v1/kaufland_status`;
const RT_REST = `${SUPABASE_URL}/rest/v1/bemusterung_raumtypen`;
const EL_REST = `${SUPABASE_URL}/rest/v1/bemusterung_elemente`;
const ATTACHMENT_BUCKET = "protokoll-anlagen"; // gleicher, bereits bestehender oeffentlicher Bucket wie bei Eigene-ToDos-Anhaengen, eigener Pfad-Praefix "bemusterung/..."

// status: offen (noch keine Entscheidung) / freigegeben / nicht_freigegeben / alternative
// (Alternative vorschlagen) / fixiert (nicht mehr verhandelbar, bauseits vorgegeben - keine
// weitere Abstimmung mit dem Bauherrn mehr noetig/moeglich)
const STATUS_OPTS = [
  { key: "offen", label: "Offen" },
  { key: "freigegeben", label: "✓ Freigegeben" },
  { key: "nicht_freigegeben", label: "✕ Nicht freigegeben" },
  { key: "alternative", label: "⇄ Alternative vorschlagen" },
  { key: "fixiert", label: "🔒 Fixiert – nicht mehr verhandelbar" },
];

let PROJEKT = null; // { id, name, projektnummer }
let RAUMTYPEN = [];
let ELEMENTE = {}; // raumtyp_id -> [element, ...]
let collapsedRaumtypen = new Set();

function qs(name) {
  return new URLSearchParams(location.search).get(name);
}
function escHtml(s) {
  return (s || "").toString().replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function sanitizeFileName(name) {
  return (name || "Datei").replace(/[^\w.\-]+/g, "_").replace(/_{2,}/g, "_").slice(0, 150);
}
function formatBytes(n) {
  if (!n && n !== 0) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
  return (n / (1024 * 1024)).toFixed(1) + " MB";
}
function newId(prefix) {
  return `${prefix}-${Date.now()}-${Math.floor(Math.random() * 100000)}`;
}

async function resolveProjekt() {
  const nr = (qs("projektnummer") || qs("projekt") || "").trim();
  const pid = (qs("projekt_id") || "").trim();
  if (!nr && !pid) {
    showError("Kein Projekt angegeben", "Bitte die Seite mit <code>?projektnummer=54601</code> (Projektnummer aus dem Dashboard) oder <code>?projekt_id=…</code> in der Adresse aufrufen.");
    return null;
  }
  try {
    const filter = pid ? `id=eq.${encodeURIComponent(pid)}` : `data->>projektnummer=eq.${encodeURIComponent(nr)}`;
    const res = await fetch(`${KAUF_REST}?select=id,data&${filter}`, { headers: HEADERS });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    if (!rows.length) {
      showError("Projekt nicht gefunden", `Zur ${pid ? "ID" : "Projektnummer"} <code>${escHtml(pid || nr)}</code> wurde im Dashboard kein Projekt gefunden.`);
      return null;
    }
    const row = rows[0];
    return { id: row.id, name: row.data.projekt || row.id, projektnummer: row.data.projektnummer || "" };
  } catch (err) {
    showError("Verbindung fehlgeschlagen", "Die Projektdaten konnten nicht geladen werden: " + escHtml(err.message));
    return null;
  }
}
function showError(title, html) {
  const el = document.getElementById("error-banner");
  el.innerHTML = `<h2>${escHtml(title)}</h2><div>${html}</div>`;
  el.hidden = false;
}

async function loadAll() {
  const [rtRes, elRes] = await Promise.all([
    fetch(`${RT_REST}?select=*&projekt_id=eq.${encodeURIComponent(PROJEKT.id)}&order=pos.asc,created_at.asc`, { headers: HEADERS }),
    fetch(`${EL_REST}?select=*&projekt_id=eq.${encodeURIComponent(PROJEKT.id)}&order=pos.asc,created_at.asc`, { headers: HEADERS }),
  ]);
  RAUMTYPEN = rtRes.ok ? await rtRes.json() : [];
  ELEMENTE = {};
  if (elRes.ok) {
    (await elRes.json()).forEach(e => {
      if (!ELEMENTE[e.raumtyp_id]) ELEMENTE[e.raumtyp_id] = [];
      ELEMENTE[e.raumtyp_id].push(e);
    });
  }
}

/* ---------- Raumtyp CRUD ---------- */
async function createRaumtyp(name) {
  const id = newId("rt");
  const payload = { id, projekt_id: PROJEKT.id, name: name || "Neuer Raumtyp", raeume: [], pos: RAUMTYPEN.length };
  const res = await fetch(RT_REST, { method: "POST", headers: { ...HEADERS, Prefer: "return=representation" }, body: JSON.stringify([payload]) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const [row] = await res.json();
  RAUMTYPEN.push(row);
  ELEMENTE[row.id] = [];
  return row;
}
async function updateRaumtyp(id, patch) {
  const res = await fetch(`${RT_REST}?id=eq.${encodeURIComponent(id)}`, {
    method: "PATCH", headers: { ...HEADERS, Prefer: "return=representation" },
    body: JSON.stringify({ ...patch, updated_at: new Date().toISOString() }),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const [row] = await res.json();
  const idx = RAUMTYPEN.findIndex(r => r.id === id);
  // Objekt-IDENTITAET beibehalten (Object.assign statt Ersetzen): DOM-Closures (z.B. der Loesch-Button)
  // halten eine Referenz auf genau dieses rt-Objekt. Wuerde die Fetch-Antwort das Array-Element durch
  // ein neues Objekt ERSETZEN, wuerden spaetere Aktionen ueber "alte" Closures ins Leere schreiben,
  // sobald ein weiterer Renderzyklus dazwischen lag (siehe gleiche Ueberlegung bei updateElement()).
  if (idx !== -1 && row) Object.assign(RAUMTYPEN[idx], row);
  return idx !== -1 ? RAUMTYPEN[idx] : row;
}
async function deleteRaumtyp(id) {
  await fetch(`${RT_REST}?id=eq.${encodeURIComponent(id)}`, { method: "DELETE", headers: HEADERS });
  RAUMTYPEN = RAUMTYPEN.filter(r => r.id !== id);
  delete ELEMENTE[id];
}

/* ---------- Element CRUD ---------- */
async function createElement(raumtypId, fields = {}) {
  const id = newId("el");
  const list = ELEMENTE[raumtypId] || [];
  const payload = {
    id, raumtyp_id: raumtypId, projekt_id: PROJEKT.id,
    name: fields.name || "", hersteller: fields.hersteller || null, fabrikat: fields.fabrikat || null,
    artikelnummer: fields.artikelnummer || null, bemerkung: fields.bemerkung || null,
    links: fields.links || [], anhaenge: fields.anhaenge || [],
    pdf_hinweise: fields.pdf_hinweise || [],
    status: fields.status || "offen", status_notiz: fields.status_notiz || null,
    pos: list.length,
  };
  const res = await fetch(EL_REST, { method: "POST", headers: { ...HEADERS, Prefer: "return=representation" }, body: JSON.stringify([payload]) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const [row] = await res.json();
  if (!ELEMENTE[raumtypId]) ELEMENTE[raumtypId] = [];
  ELEMENTE[raumtypId].push(row);
  return row;
}
async function updateElement(id, raumtypId, patch) {
  const res = await fetch(`${EL_REST}?id=eq.${encodeURIComponent(id)}`, {
    method: "PATCH", headers: { ...HEADERS, Prefer: "return=representation" },
    body: JSON.stringify({ ...patch, updated_at: new Date().toISOString() }),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const [row] = await res.json();
  const list = ELEMENTE[raumtypId] || [];
  const idx = list.findIndex(e => e.id === id);
  // Siehe Kommentar in updateRaumtyp(): bewusst Object.assign statt Ersetzen, damit die von
  // buildElementRow() gehaltene "el"-Referenz (Status-Dropdown, Speicher-Closures etc.) nach dem
  // Eintreffen der Serverantwort weiterhin auf dasselbe, aktuelle Objekt im ELEMENTE-Array zeigt -
  // sonst koennten z.B. KPI-Zaehlungen nach mehreren schnellen Aenderungen veraltete Werte zeigen.
  if (idx !== -1 && row) Object.assign(list[idx], row);
  return idx !== -1 ? list[idx] : row;
}
async function deleteElement(id, raumtypId) {
  await fetch(`${EL_REST}?id=eq.${encodeURIComponent(id)}`, { method: "DELETE", headers: HEADERS });
  ELEMENTE[raumtypId] = (ELEMENTE[raumtypId] || []).filter(e => e.id !== id);
}

/* ---------- Anhaenge (PDF/Dokumente) - gleiches Muster (Storage-REST-Endpunkt via fetch, kein
   Supabase-JS-Client noetig) wie die Eigene-ToDos-Anhaenge im Protokoll-App bereits verwenden. ---------- */
async function uploadElementAttachment(raumtypId, elementId, file) {
  const path = `bemusterung/${raumtypId}/${elementId}/${Date.now()}-${Math.floor(Math.random() * 100000)}-${sanitizeFileName(file.name)}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${ATTACHMENT_BUCKET}/${path}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": file.type || "application/octet-stream", "x-upsert": "true" },
    body: file,
  });
  if (!res.ok) { const t = await res.text().catch(() => ""); throw new Error(`Upload HTTP ${res.status} ${t.slice(0, 200)}`); }
  return { name: file.name, path, url: `${SUPABASE_URL}/storage/v1/object/public/${ATTACHMENT_BUCKET}/${path}`, size: file.size, type: file.type || "" };
}
async function removeElementAttachment(a) {
  if (!a || !a.path) return;
  try { await fetch(`${SUPABASE_URL}/storage/v1/object/${ATTACHMENT_BUCKET}/${a.path}`, { method: "DELETE", headers: HEADERS }); }
  catch (err) { console.error("Anhang konnte nicht aus dem Storage entfernt werden:", err); }
}

/* ---------- Element-Bild (JPG-Upload oder PNG-Ausschnitt aus PDF) ---------- */
const PDFJS_SRC = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let pdfjsPromise = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (!pdfjsPromise) pdfjsPromise = new Promise((resolve, reject) => {
    const sc = document.createElement("script");
    sc.src = PDFJS_SRC;
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; resolve(window.pdfjsLib); };
    sc.onerror = () => { pdfjsPromise = null; reject(new Error("PDF-Bibliothek konnte nicht geladen werden")); };
    document.head.appendChild(sc);
  });
  return pdfjsPromise;
}
async function uploadBild(raumtypId, elementId, blob, fileName) {
  const ext = (blob.type === "image/png") ? "png" : (blob.type === "image/webp" ? "webp" : "jpg");
  const base = sanitizeFileName(fileName || "bild").replace(/\.[A-Za-z0-9]+$/, "");
  const path = `bemusterung/${raumtypId}/${elementId}/bild-${Date.now()}-${base}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${ATTACHMENT_BUCKET}/${path}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": blob.type || "image/jpeg", "x-upsert": "true" },
    body: blob,
  });
  if (!res.ok) { const t = await res.text().catch(() => ""); throw new Error(`Upload HTTP ${res.status} ${t.slice(0, 200)}`); }
  return { bild_path: path, bild_url: `${SUPABASE_URL}/storage/v1/object/public/${ATTACHMENT_BUCKET}/${path}` };
}
async function removeBildFile(path) {
  if (!path) return;
  try { await fetch(`${SUPABASE_URL}/storage/v1/object/${ATTACHMENT_BUCKET}/${path}`, { method: "DELETE", headers: HEADERS }); }
  catch (err) { console.error("Bild konnte nicht aus dem Storage entfernt werden:", err); }
}
// Grosse Fotos vor dem Upload auf max. 1600 px verkleinern (JPG bleibt JPG)
async function downscaleImage(file, maxDim = 1600) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
    if (scale >= 1 && file.size < 1.5 * 1024 * 1024) return file;
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const type = file.type === "image/png" ? "image/png" : "image/jpeg";
    return await new Promise(res => c.toBlob(b => res(b || file), type, 0.88));
  } catch (e) { return file; }
}
function showLightbox(url) {
  const bg = document.createElement("div");
  bg.className = "modal-bg lightbox";
  bg.innerHTML = `<img src="${escHtml(url)}" alt="">`;
  bg.addEventListener("click", () => bg.remove());
  document.body.appendChild(bg);
}

function buildBildBox(el, raumtypId, save) {
  const box = document.createElement("div");
  box.className = "el-bild-box";
  const thumb = document.createElement("div");
  thumb.className = "el-bild-thumb";
  if (el.bild_url) {
    const img = document.createElement("img");
    img.src = el.bild_url; img.alt = el.name || "Bild"; img.loading = "lazy";
    img.addEventListener("click", () => showLightbox(el.bild_url));
    thumb.appendChild(img);
  } else {
    thumb.textContent = "Kein Bild";
  }
  box.appendChild(thumb);

  const btns = document.createElement("div");
  btns.className = "el-bild-btns";
  const upBtn = document.createElement("button");
  upBtn.type = "button"; upBtn.textContent = el.bild_url ? "🖼 Bild ersetzen (JPG)" : "🖼 Bild hochladen (JPG)";
  const fileInput = document.createElement("input");
  fileInput.type = "file"; fileInput.accept = "image/jpeg,image/png,image/webp"; fileInput.style.display = "none";
  async function setBild(blob, name) {
    const old = el.bild_path;
    const meta = await uploadBild(raumtypId, el.id, blob, name);
    await save(meta);
    if (old && old !== meta.bild_path) removeBildFile(old);
    renderAll();
  }
  fileInput.addEventListener("change", async () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (!f) return;
    upBtn.disabled = true; upBtn.textContent = "Wird hochgeladen …";
    try { await setBild(await downscaleImage(f), f.name); }
    catch (err) { alert("Bild konnte nicht hochgeladen werden: " + (err.message || err)); upBtn.disabled = false; upBtn.textContent = "🖼 Bild hochladen (JPG)"; }
  });
  upBtn.addEventListener("click", () => fileInput.click());
  btns.appendChild(fileInput);
  btns.appendChild(upBtn);

  const pdfBtn = document.createElement("button");
  pdfBtn.type = "button"; pdfBtn.textContent = "✂ Ausschnitt aus PDF";
  pdfBtn.addEventListener("click", () => openPdfCropper(el, async blob => { await setBild(blob, (el.name || "ausschnitt") + ".png"); }));
  btns.appendChild(pdfBtn);

  if (el.bild_url) {
    const delBtn = document.createElement("button");
    delBtn.type = "button"; delBtn.className = "danger"; delBtn.textContent = "✕ Bild entfernen";
    delBtn.addEventListener("click", async () => {
      if (!confirm("Bild wirklich entfernen?")) return;
      const old = el.bild_path;
      await save({ bild_url: null, bild_path: null });
      removeBildFile(old);
      renderAll();
    });
    btns.appendChild(delBtn);
  }
  box.appendChild(btns);
  return box;
}

// PDF-Ausschnitt: PDF waehlen (vorhandener Anhang oder lokale Datei), Seite anzeigen, Rahmen aufziehen -> PNG
async function openPdfCropper(el, onDone) {
  let pdfjs;
  try { pdfjs = await loadPdfJs(); } catch (err) { alert(err.message); return; }
  const pdfAnh = (el.anhaenge || []).filter(a => /pdf/i.test(a.type || "") || /\.pdf$/i.test(a.name || ""));

  const bg = document.createElement("div");
  bg.className = "modal-bg";
  const modal = document.createElement("div");
  modal.className = "modal";
  bg.appendChild(modal);
  const head = document.createElement("div");
  head.className = "modal-head";
  head.innerHTML = `<h3>Ausschnitt aus PDF – ${escHtml(el.name || "Element")}</h3>`;
  const sel = document.createElement("select");
  pdfAnh.forEach((a, i) => { const o = document.createElement("option"); o.value = String(i); o.textContent = a.name; sel.appendChild(o); });
  const localOpt = document.createElement("option"); localOpt.value = "local"; localOpt.textContent = "Lokale PDF wählen …";
  sel.appendChild(localOpt);
  head.appendChild(sel);
  const pgPrev = document.createElement("button"); pgPrev.type = "button"; pgPrev.className = "hbtn"; pgPrev.textContent = "◀";
  const pgInfo = document.createElement("span"); pgInfo.className = "pg"; pgInfo.textContent = "–";
  const pgNext = document.createElement("button"); pgNext.type = "button"; pgNext.className = "hbtn"; pgNext.textContent = "▶";
  head.appendChild(pgPrev); head.appendChild(pgInfo); head.appendChild(pgNext);
  modal.appendChild(head);
  const mbody = document.createElement("div");
  mbody.className = "modal-body";
  modal.appendChild(mbody);
  const foot = document.createElement("div");
  foot.className = "modal-foot";
  const hint = document.createElement("span"); hint.className = "crop-hint"; hint.textContent = "Mit der Maus einen Rahmen um das Element ziehen.";
  const cancel = document.createElement("button"); cancel.type = "button"; cancel.className = "hbtn"; cancel.textContent = "Abbrechen";
  const ok = document.createElement("button"); ok.type = "button"; ok.className = "hbtn hbtn-blue"; ok.textContent = "Ausschnitt übernehmen"; ok.disabled = true;
  foot.appendChild(hint); foot.appendChild(cancel); foot.appendChild(ok);
  modal.appendChild(foot);
  const lf = document.createElement("input"); lf.type = "file"; lf.accept = "application/pdf"; lf.style.display = "none";
  document.body.appendChild(bg); bg.appendChild(lf);
  const close = () => bg.remove();
  cancel.addEventListener("click", close);

  let pdf = null, pageNo = 1, canvas = null, selRect = null, selDiv = null;

  async function renderPage() {
    mbody.innerHTML = "Lade Seite …"; ok.disabled = true; selRect = null;
    const page = await pdf.getPage(pageNo);
    const maxW = Math.min(window.innerWidth * 0.9 - 60, 1100);
    const base = page.getViewport({ scale: 1 });
    const scale = Math.max(1, Math.min(3, (maxW / base.width) * 2)); // 2x fuer scharfe Ausschnitte
    const vp = page.getViewport({ scale });
    canvas = document.createElement("canvas");
    canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    canvas.style.width = Math.min(maxW, vp.width) + "px";
    const wrap = document.createElement("div"); wrap.className = "crop-wrap";
    wrap.appendChild(canvas);
    selDiv = document.createElement("div"); selDiv.className = "crop-sel"; selDiv.style.display = "none";
    wrap.appendChild(selDiv);
    mbody.innerHTML = ""; mbody.appendChild(wrap);
    pgInfo.textContent = `Seite ${pageNo} / ${pdf.numPages}`;
    let start = null;
    const pos = e => { const r = canvas.getBoundingClientRect(); return { x: Math.max(0, Math.min(r.width, e.clientX - r.left)), y: Math.max(0, Math.min(r.height, e.clientY - r.top)) }; };
    wrap.addEventListener("pointerdown", e => { start = pos(e); wrap.setPointerCapture(e.pointerId); selDiv.style.display = "none"; ok.disabled = true; });
    wrap.addEventListener("pointermove", e => {
      if (!start) return;
      const p = pos(e);
      selRect = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) };
      Object.assign(selDiv.style, { display: "block", left: selRect.x + "px", top: selRect.y + "px", width: selRect.w + "px", height: selRect.h + "px" });
    });
    wrap.addEventListener("pointerup", () => { start = null; ok.disabled = !(selRect && selRect.w > 8 && selRect.h > 8); });
  }
  async function loadPdf(src) {
    mbody.textContent = "Lade PDF …"; ok.disabled = true;
    try {
      pdf = await pdfjs.getDocument(src).promise; pageNo = 1;
      await renderPage();
    } catch (err) { mbody.textContent = "PDF konnte nicht geladen werden: " + (err.message || err); }
  }
  pgPrev.addEventListener("click", () => { if (pdf && pageNo > 1) { pageNo--; renderPage(); } });
  pgNext.addEventListener("click", () => { if (pdf && pageNo < pdf.numPages) { pageNo++; renderPage(); } });
  sel.addEventListener("change", () => {
    if (sel.value === "local") lf.click(); else loadPdf({ url: pdfAnh[Number(sel.value)].url });
  });
  lf.addEventListener("change", async () => {
    const f = lf.files && lf.files[0]; lf.value = "";
    if (f) loadPdf({ data: new Uint8Array(await f.arrayBuffer()) });
  });
  ok.addEventListener("click", async () => {
    if (!selRect || !canvas) return;
    const k = canvas.width / canvas.getBoundingClientRect().width;
    const out = document.createElement("canvas");
    out.width = Math.round(selRect.w * k); out.height = Math.round(selRect.h * k);
    out.getContext("2d").drawImage(canvas, selRect.x * k, selRect.y * k, out.width, out.height, 0, 0, out.width, out.height);
    ok.disabled = true; ok.textContent = "Wird gespeichert …";
    const blob = await new Promise(res => out.toBlob(res, "image/png"));
    try { await onDone(blob); close(); }
    catch (err) { alert("Ausschnitt konnte nicht gespeichert werden: " + (err.message || err)); ok.disabled = false; ok.textContent = "Ausschnitt übernehmen"; }
  });

  if (pdfAnh.length) { sel.value = "0"; loadPdf({ url: pdfAnh[0].url }); }
  else { mbody.textContent = "Kein PDF am Element hinterlegt – bitte „Lokale PDF wählen …“ nutzen."; sel.value = "local"; lf.click(); }
}

/* ---------- Rendering ---------- */
function computeKpis() {
  const k = { raumtypen: RAUMTYPEN.length, raeume: 0, elemente: 0, offen: 0, freigegeben: 0, nicht_freigegeben: 0, alternative: 0, fixiert: 0 };
  const roomSet = new Set();
  RAUMTYPEN.forEach(rt => (rt.raeume || []).forEach(r => roomSet.add(r)));
  k.raeume = roomSet.size;
  Object.values(ELEMENTE).forEach(list => list.forEach(e => {
    k.elemente++;
    k[e.status || "offen"] = (k[e.status || "offen"] || 0) + 1;
  }));
  return k;
}
function renderKpis() {
  const k = computeKpis();
  const tiles = [
    ["raumtypen", "Raumtypen", k.raumtypen],
    ["raeume", "Räume gesamt", k.raeume],
    ["elemente", "Elemente", k.elemente],
    ["freigegeben", "Freigegeben", k.freigegeben],
    ["nicht_freigegeben", "Nicht freigegeben", k.nicht_freigegeben],
    ["alternative", "Alternative vorgeschlagen", k.alternative],
    ["fixiert", "Fixiert", k.fixiert],
  ];
  document.getElementById("kpi-row").innerHTML = tiles.map(([key, label, val]) =>
    `<div class="kpi-tile k-${key}"><div class="kpi-value">${val}</div><div class="kpi-label">${escHtml(label)}</div></div>`
  ).join("");
}

function renderAll() {
  renderKpis();
  const list = document.getElementById("raumtypen-list");
  list.innerHTML = "";
  if (!RAUMTYPEN.length) {
    list.innerHTML = '<div class="empty-hint">Noch keine Raumtypen angelegt – mit „+ Raumtyp anlegen“ oben starten.</div>';
    return;
  }
  RAUMTYPEN.forEach(rt => list.appendChild(buildRaumtypCard(rt)));
}

function buildRaumtypCard(rt) {
  const card = document.createElement("div");
  card.className = "raumtyp-card";
  const collapsed = collapsedRaumtypen.has(rt.id);

  const head = document.createElement("div");
  head.className = "raumtyp-head" + (collapsed ? " collapsed" : "");
  const caret = document.createElement("span");
  caret.className = "raumtyp-caret";
  caret.textContent = collapsed ? "▸" : "▾";
  caret.addEventListener("click", () => {
    if (collapsedRaumtypen.has(rt.id)) collapsedRaumtypen.delete(rt.id); else collapsedRaumtypen.add(rt.id);
    renderAll();
  });
  head.appendChild(caret);

  const nameInput = document.createElement("input");
  nameInput.className = "raumtyp-name-input";
  nameInput.value = rt.name || "";
  nameInput.addEventListener("blur", async () => {
    if (nameInput.value === rt.name) return;
    try { await updateRaumtyp(rt.id, { name: nameInput.value }); } catch (err) { alert("Konnte nicht gespeichert werden: " + err.message); }
    renderKpis();
  });
  head.appendChild(nameInput);

  const count = document.createElement("span");
  count.className = "raumtyp-count";
  count.textContent = `${(rt.raeume || []).length} Räume · ${(ELEMENTE[rt.id] || []).length} Elemente`;
  head.appendChild(count);

  const delBtn = document.createElement("button");
  delBtn.type = "button";
  delBtn.className = "raumtyp-delete";
  delBtn.textContent = "✕ Raumtyp löschen";
  delBtn.addEventListener("click", async () => {
    if (!confirm(`Raumtyp "${rt.name}" inkl. aller ${(ELEMENTE[rt.id] || []).length} Elemente wirklich löschen?`)) return;
    try { await deleteRaumtyp(rt.id); renderAll(); } catch (err) { alert("Löschen fehlgeschlagen: " + err.message); }
  });
  head.appendChild(delBtn);
  card.appendChild(head);

  if (!collapsed) {
    const raeumeRow = document.createElement("div");
    raeumeRow.className = "raeume-row";
    const label = document.createElement("span");
    label.className = "raeume-label";
    label.textContent = "Räume:";
    raeumeRow.appendChild(label);
    (rt.raeume || []).forEach(raumnr => {
      const chip = document.createElement("span");
      chip.className = "raum-chip";
      chip.innerHTML = `${escHtml(raumnr)} `;
      const rm = document.createElement("button");
      rm.type = "button";
      rm.textContent = "✕";
      rm.addEventListener("click", async () => {
        try { await updateRaumtyp(rt.id, { raeume: (rt.raeume || []).filter(r => r !== raumnr) }); renderAll(); }
        catch (err) { alert("Konnte nicht gespeichert werden: " + err.message); }
      });
      chip.appendChild(rm);
      raeumeRow.appendChild(chip);
    });
    const addInput = document.createElement("input");
    addInput.className = "raum-add-input";
    addInput.placeholder = "+ Raum-Nr.";
    addInput.addEventListener("keydown", async e => {
      if (e.key !== "Enter") return;
      const val = addInput.value.trim();
      if (!val) return;
      addInput.value = "";
      try { await updateRaumtyp(rt.id, { raeume: [...(rt.raeume || []), val] }); renderAll(); }
      catch (err) { alert("Konnte nicht gespeichert werden: " + err.message); }
    });
    raeumeRow.appendChild(addInput);
    card.appendChild(raeumeRow);
  }

  const body = document.createElement("div");
  body.className = "elemente-body" + (collapsed ? " collapsed" : "");
  const elList = ELEMENTE[rt.id] || [];
  if (!elList.length) {
    const hint = document.createElement("div");
    hint.className = "empty-hint";
    hint.textContent = "Noch keine Elemente – mit „+ Element hinzufügen“ starten.";
    body.appendChild(hint);
  }
  elList.forEach(el => body.appendChild(buildElementRow(el, rt.id)));

  const addElBtn = document.createElement("button");
  addElBtn.type = "button";
  addElBtn.className = "add-element-btn";
  addElBtn.textContent = "+ Element hinzufügen";
  addElBtn.addEventListener("click", async () => {
    try { await createElement(rt.id, { name: "" }); renderAll(); }
    catch (err) { alert("Anlegen fehlgeschlagen: " + err.message); }
  });
  body.appendChild(addElBtn);
  card.appendChild(body);

  return card;
}

function buildElementRow(el, raumtypId) {
  const row = document.createElement("div");
  row.className = `element-row is-neu-status-${el.status || "offen"}`;
  const layout = document.createElement("div");
  layout.className = "el-layout";
  const main = document.createElement("div");
  main.className = "el-main";
  row.appendChild(layout);

  async function save(patch) {
    try { Object.assign(el, patch); await updateElement(el.id, raumtypId, patch); }
    catch (err) { alert("Speichern fehlgeschlagen: " + err.message); }
  }

  const row1 = document.createElement("div");
  row1.className = "el-row1";
  const nameInput = document.createElement("input");
  nameInput.className = "el-name-input";
  nameInput.placeholder = "Elementname (z.B. Waschtisch)";
  nameInput.value = el.name || "";
  nameInput.addEventListener("blur", () => { if (nameInput.value !== el.name) save({ name: nameInput.value }); });
  row1.appendChild(nameInput);
  const removeBtn = document.createElement("button");
  removeBtn.type = "button";
  removeBtn.className = "el-remove-btn";
  removeBtn.textContent = "✕";
  removeBtn.addEventListener("click", async () => {
    if (!confirm(`Element "${el.name || "(ohne Namen)"}" wirklich entfernen?`)) return;
    try { await deleteElement(el.id, raumtypId); renderAll(); } catch (err) { alert("Löschen fehlgeschlagen: " + err.message); }
  });
  row1.appendChild(removeBtn);
  main.appendChild(row1);

  const row2 = document.createElement("div");
  row2.className = "el-row2";
  [["hersteller", "Hersteller"], ["fabrikat", "Fabrikat"], ["artikelnummer", "Artikelnummer"]].forEach(([key, ph]) => {
    const inp = document.createElement("input");
    inp.placeholder = ph;
    inp.value = el[key] || "";
    inp.addEventListener("blur", () => { if (inp.value !== (el[key] || "")) save({ [key]: inp.value }); });
    row2.appendChild(inp);
  });
  main.appendChild(row2);

  const bemInput = document.createElement("input");
  bemInput.className = "el-bemerkung-input";
  bemInput.placeholder = "Bemerkung (z.B. Beistellung AWO, Auswahl nach Aufmaß …)";
  bemInput.value = el.bemerkung || "";
  bemInput.addEventListener("blur", () => { if (bemInput.value !== (el.bemerkung || "")) save({ bemerkung: bemInput.value }); });
  main.appendChild(bemInput);

  // Website-Links
  const linksRow = document.createElement("div");
  linksRow.className = "el-links-row";
  const linksLabel = document.createElement("span");
  linksLabel.className = "el-mini-label";
  linksLabel.textContent = "🔗 Links:";
  linksRow.appendChild(linksLabel);
  (el.links || []).forEach((url, idx) => {
    const chip = document.createElement("a");
    chip.className = "el-link-chip";
    chip.href = url; chip.target = "_blank"; chip.rel = "noopener";
    chip.innerHTML = `<span class="txt">${escHtml(url)}</span>`;
    const rm = document.createElement("button");
    rm.type = "button"; rm.textContent = "✕";
    rm.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation();
      const newLinks = (el.links || []).filter((_, i) => i !== idx);
      save({ links: newLinks }); renderAll();
    });
    chip.appendChild(rm);
    linksRow.appendChild(chip);
  });
  const linkAddBtn = document.createElement("button");
  linkAddBtn.type = "button";
  linkAddBtn.className = "el-link-btn";
  linkAddBtn.textContent = "+ Link";
  const linkInput = document.createElement("input");
  linkInput.className = "el-link-add-input";
  linkInput.placeholder = "https:// … + Enter";
  linkInput.style.display = "none";
  linkInput.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const val = linkInput.value.trim();
    if (!val) return;
    linkInput.value = ""; linkInput.style.display = "none"; linkAddBtn.style.display = "";
    save({ links: [...(el.links || []), val] }); renderAll();
  });
  linkAddBtn.addEventListener("click", () => { linkAddBtn.style.display = "none"; linkInput.style.display = ""; linkInput.focus(); });
  linksRow.appendChild(linkAddBtn);
  linksRow.appendChild(linkInput);
  main.appendChild(linksRow);

  // PDF-Anhaenge
  const anhRow = document.createElement("div");
  anhRow.className = "el-anh-row";
  const anhLabel = document.createElement("span");
  anhLabel.className = "el-mini-label";
  anhLabel.textContent = "📎 Dokumente:";
  anhRow.appendChild(anhLabel);
  (el.anhaenge || []).forEach((a, idx) => {
    const chip = document.createElement("a");
    chip.className = "el-anh-chip";
    chip.href = a.url; chip.target = "_blank"; chip.rel = "noopener"; chip.title = a.name;
    chip.innerHTML = `<span>📄</span><span class="name">${escHtml(a.name)}</span><span class="size">${escHtml(formatBytes(a.size))}</span>`;
    const rm = document.createElement("button");
    rm.type = "button"; rm.textContent = "✕";
    rm.addEventListener("click", async e => {
      e.preventDefault(); e.stopPropagation();
      await removeElementAttachment(a);
      const newAnh = (el.anhaenge || []).filter((_, i) => i !== idx);
      await save({ anhaenge: newAnh }); renderAll();
    });
    chip.appendChild(rm);
    anhRow.appendChild(chip);
  });
  // PDF ausstehend: aus dem Excel-Import uebernommene Dateinamen-Hinweise, fuer die noch keine
  // echte Datei hochgeladen wurde (die Originaldateien lagen nur lokal bei Marcus und wurden beim
  // Import nicht mit uebertragen). Sobald das echte PDF oben hochgeladen wurde, kann der Hinweis
  // mit dem "x" entfernt werden.
  (el.pdf_hinweise || []).forEach((fname, idx) => {
    const chip = document.createElement("span");
    chip.className = "el-pdf-pending-chip";
    chip.title = `PDF ausstehend: ${fname} – bitte Original hochladen und diesen Hinweis dann entfernen`;
    chip.innerHTML = `<span>⏳</span><span class="name">PDF ausstehend: ${escHtml(fname)}</span>`;
    const rm = document.createElement("button");
    rm.type = "button"; rm.textContent = "✕";
    rm.addEventListener("click", () => {
      const newHinweise = (el.pdf_hinweise || []).filter((_, i) => i !== idx);
      save({ pdf_hinweise: newHinweise }); renderAll();
    });
    chip.appendChild(rm);
    anhRow.appendChild(chip);
  });
  const attachBtn = document.createElement("button");
  attachBtn.type = "button";
  attachBtn.className = "el-attach-btn";
  attachBtn.textContent = "📎 PDF/Dokument hochladen";
  const fileInput = document.createElement("input");
  fileInput.type = "file"; fileInput.multiple = true; fileInput.accept = ".pdf,.doc,.docx,.xls,.xlsx,image/*";
  fileInput.style.display = "none";
  fileInput.addEventListener("change", async () => {
    const files = Array.from(fileInput.files || []);
    fileInput.value = "";
    if (!files.length) return;
    attachBtn.disabled = true; attachBtn.classList.add("uploading"); attachBtn.textContent = "Wird hochgeladen …";
    let anh = [...(el.anhaenge || [])];
    for (const file of files) {
      try { const meta = await uploadElementAttachment(raumtypId, el.id, file); anh.push(meta); }
      catch (err) { alert(`Anhang "${file.name}" konnte nicht hochgeladen werden: ` + (err.message || err)); }
    }
    attachBtn.disabled = false; attachBtn.classList.remove("uploading"); attachBtn.textContent = "📎 PDF/Dokument hochladen";
    await save({ anhaenge: anh }); renderAll();
  });
  attachBtn.addEventListener("click", () => fileInput.click());
  anhRow.appendChild(fileInput);
  anhRow.appendChild(attachBtn);
  main.appendChild(anhRow);

  // Status + Notiz
  const statusRow = document.createElement("div");
  statusRow.className = "el-row-status";
  const statusSel = document.createElement("select");
  statusSel.className = `el-status-select s-${el.status || "offen"}`;
  STATUS_OPTS.forEach(opt => {
    const o = document.createElement("option");
    o.value = opt.key; o.textContent = opt.label;
    if ((el.status || "offen") === opt.key) o.selected = true;
    statusSel.appendChild(o);
  });
  statusSel.addEventListener("change", () => {
    statusSel.className = `el-status-select s-${statusSel.value}`;
    row.className = `element-row is-neu-status-${statusSel.value}`;
    save({ status: statusSel.value }); renderKpis();
  });
  statusRow.appendChild(statusSel);
  const notizInput = document.createElement("input");
  notizInput.className = "el-status-notiz";
  notizInput.placeholder = "Bemerkung zur Freigabe (z.B. Rückmeldung Bauherr) …";
  notizInput.value = el.status_notiz || "";
  notizInput.addEventListener("blur", () => { if (notizInput.value !== (el.status_notiz || "")) save({ status_notiz: notizInput.value }); });
  statusRow.appendChild(notizInput);
  main.appendChild(statusRow);

  layout.appendChild(buildBildBox(el, raumtypId, save));
  layout.appendChild(main);
  return row;
}

/* ---------- Raumtyp anlegen (Toolbar) ---------- */
function wireAddRaumtypButton() {
  const btn = document.getElementById("show-add-raumtyp-btn");
  const holder = document.getElementById("add-raumtyp-form-holder");
  btn.addEventListener("click", () => {
    if (holder.firstChild) return;
    const form = document.createElement("div");
    form.className = "add-raumtyp-form";
    const input = document.createElement("input");
    input.placeholder = "Name des Raumtyps (z.B. Einzelzimmer Bad EG)";
    form.appendChild(input);
    const saveBtn = document.createElement("button");
    saveBtn.type = "button"; saveBtn.className = "hbtn hbtn-blue"; saveBtn.textContent = "Anlegen";
    saveBtn.addEventListener("click", async () => {
      const name = input.value.trim();
      if (!name) { input.focus(); return; }
      try { await createRaumtyp(name); holder.innerHTML = ""; renderAll(); }
      catch (err) { alert("Anlegen fehlgeschlagen: " + err.message); }
    });
    form.appendChild(saveBtn);
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button"; cancelBtn.className = "hbtn"; cancelBtn.textContent = "Abbrechen";
    cancelBtn.addEventListener("click", () => { holder.innerHTML = ""; });
    form.appendChild(cancelBtn);
    holder.appendChild(form);
    input.focus();
    input.addEventListener("keydown", e => { if (e.key === "Enter") saveBtn.click(); });
  });
}

/* ---------- Drucken (Filter nach Raum / Raumtyp / Status) ---------- */
function openPrintDialog() {
  const allRooms = [];
  RAUMTYPEN.forEach(rt => (rt.raeume || []).forEach(r => { if (!allRooms.includes(r)) allRooms.push(r); }));
  allRooms.sort((a, b) => String(a).localeCompare(String(b), "de", { numeric: true }));

  const bg = document.createElement("div");
  bg.className = "modal-bg";
  const modal = document.createElement("div");
  modal.className = "modal";
  bg.appendChild(modal);
  modal.innerHTML = `<div class="modal-head"><h3>🖨 Bemusterungsliste drucken</h3></div>`;
  const body = document.createElement("div");
  body.className = "modal-body";
  modal.appendChild(body);

  function group(title, items, name, checked) {
    const g = document.createElement("div");
    g.className = "pf-group";
    const h = document.createElement("h4");
    h.innerHTML = `${escHtml(title)} <span class="pf-links"><a data-a="all">alle</a> · <a data-a="none">keine</a></span>`;
    g.appendChild(h);
    const wrap = document.createElement("div");
    wrap.className = "pf-checks";
    items.forEach(([val, label]) => {
      const l = document.createElement("label");
      l.innerHTML = `<input type="checkbox" name="${name}" value="${escHtml(val)}" ${checked ? "checked" : ""}> ${escHtml(label)}`;
      wrap.appendChild(l);
    });
    if (!items.length) wrap.innerHTML = '<span class="empty-hint">Keine vorhanden</span>';
    g.appendChild(wrap);
    h.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
      wrap.querySelectorAll("input").forEach(i => { i.checked = a.dataset.a === "all"; });
      updateCount();
    }));
    body.appendChild(g);
  }
  // Raeume: standardmaessig keine Auswahl = alle
  group("Status", STATUS_OPTS.map(o => [o.key, o.label]), "st", true);
  group("Raumtypen", RAUMTYPEN.map(rt => [rt.id, rt.name || "(ohne Namen)"]), "rt", true);
  group("Räume (leer = alle; Auswahl gruppiert nach Raum)", allRooms.map(r => [r, r]), "rm", false);

  const opt = document.createElement("div");
  opt.className = "pf-group";
  opt.innerHTML = `<div class="pf-checks">
    <label><input type="checkbox" id="pf-img" checked> Bilder mitdrucken</label>
    <label><input type="checkbox" id="pf-notiz" checked> Bemerkungen mitdrucken</label></div>`;
  body.appendChild(opt);

  const foot = document.createElement("div");
  foot.className = "modal-foot";
  const cnt = document.createElement("span"); cnt.className = "pf-count";
  const cancel = document.createElement("button"); cancel.type = "button"; cancel.className = "hbtn"; cancel.textContent = "Abbrechen";
  const go = document.createElement("button"); go.type = "button"; go.className = "hbtn hbtn-blue"; go.textContent = "Drucken / als PDF speichern";
  foot.appendChild(cnt); foot.appendChild(cancel); foot.appendChild(go);
  modal.appendChild(foot);
  document.body.appendChild(bg);

  const vals = n => Array.from(modal.querySelectorAll(`input[name=${n}]:checked`)).map(i => i.value);
  const filters = () => ({ st: vals("st"), rt: vals("rt"), rm: vals("rm"), img: modal.querySelector("#pf-img").checked, notiz: modal.querySelector("#pf-notiz").checked });
  function updateCount() { cnt.textContent = `${buildPrintSections(filters()).reduce((n, s) => n + s.elemente.length, 0)} Einträge`; }
  modal.addEventListener("change", updateCount);
  updateCount();
  cancel.addEventListener("click", () => bg.remove());
  go.addEventListener("click", async () => {
    const f = filters();
    bg.remove();
    await printList(f);
  });
}

// Liefert Abschnitte [{titel, sub, elemente}] - nach Raumtyp, bei Raumauswahl nach Raum
function buildPrintSections(f) {
  const out = [];
  const stOk = e => f.st.includes(e.status || "offen");
  const rts = RAUMTYPEN.filter(rt => f.rt.includes(rt.id));
  if (f.rm.length) {
    const sorted = [...f.rm].sort((a, b) => String(a).localeCompare(String(b), "de", { numeric: true }));
    sorted.forEach(room => {
      const types = rts.filter(rt => (rt.raeume || []).includes(room));
      types.forEach(rt => {
        const els = (ELEMENTE[rt.id] || []).filter(stOk);
        if (els.length) out.push({ titel: `Raum ${room}`, sub: rt.name || "", elemente: els });
      });
    });
  } else {
    rts.forEach(rt => {
      const els = (ELEMENTE[rt.id] || []).filter(stOk);
      if (els.length) out.push({ titel: rt.name || "(ohne Namen)", sub: (rt.raeume || []).length ? "Räume: " + rt.raeume.join(", ") : "", elemente: els });
    });
  }
  return out;
}

async function printList(f) {
  const secs = buildPrintSections(f);
  if (!secs.length) { alert("Keine Einträge für diese Auswahl."); return; }
  const ST_SHORT = { offen: "Offen", freigegeben: "Freigegeben", nicht_freigegeben: "Nicht freigegeben", alternative: "Alternative", fixiert: "Fixiert" };
  const stLabel = k => ST_SHORT[k] || k;
  const allSt = f.st.length === STATUS_OPTS.length;
  const bits = [];
  bits.push(allSt ? "Alle Status" : "Status: " + f.st.map(stLabel).join(", "));
  if (f.rm.length) bits.push("Räume: " + f.rm.join(", "));
  if (f.rt.length !== RAUMTYPEN.length) bits.push(`${f.rt.length} von ${RAUMTYPEN.length} Raumtypen`);
  const today = new Date().toLocaleDateString("de-DE");
  let html = `<div class="pr-title">Bemusterungsliste</div><div class="pr-sub">${escHtml((PROJEKT.projektnummer ? PROJEKT.projektnummer + " · " : "") + PROJEKT.name)} · Stand ${today}<br>${escHtml(bits.join(" · "))}</div>`;
  secs.forEach(sec => {
    html += `<div class="pr-sec"><h2>${escHtml(sec.titel)}${sec.sub ? `<small>${escHtml(sec.sub)}</small>` : ""}</h2><table class="pr-tbl"><thead><tr>${f.img ? "<th style='width:78pt'>Bild</th>" : ""}<th>Element</th><th>Hersteller / Fabrikat / Art.-Nr.</th><th>Status</th>${f.notiz ? "<th>Bemerkung</th>" : ""}</tr></thead><tbody>`;
    sec.elemente.forEach(e => {
      const spec = [e.hersteller, e.fabrikat, e.artikelnummer].filter(Boolean).map(escHtml).join("<br>");
      const notes = [e.bemerkung, e.status_notiz ? "Freigabe: " + e.status_notiz : ""].filter(Boolean).map(escHtml).join("<br>");
      html += `<tr>${f.img ? `<td>${e.bild_url ? `<img class="pr-img" src="${escHtml(e.bild_url)}" alt="">` : '<div class="pr-noimg">–</div>'}</td>` : ""}<td><b>${escHtml(e.name || "(ohne Namen)")}</b></td><td>${spec}</td><td><span class="pr-st s-${e.status || "offen"}">${escHtml(stLabel(e.status || "offen"))}</span></td>${f.notiz ? `<td>${notes}</td>` : ""}</tr>`;
    });
    html += "</tbody></table></div>";
  });
  const area = document.getElementById("print-area");
  area.innerHTML = html;
  // warten bis alle Bilder geladen sind
  await Promise.all(Array.from(area.querySelectorAll("img")).map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  document.body.classList.add("printing");
  const done = () => { document.body.classList.remove("printing"); area.innerHTML = ""; window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  window.print();
}

/* ---------- Init ---------- */
async function init() {
  wireAddRaumtypButton();
  document.getElementById("print-btn").addEventListener("click", () => { if (PROJEKT) openPrintDialog(); });
  PROJEKT = await resolveProjekt();
  if (!PROJEKT) return;
  document.getElementById("proj-label").textContent = `${PROJEKT.projektnummer ? PROJEKT.projektnummer + " · " : ""}${PROJEKT.name}`;
  document.title = `Bemusterungsliste – ${PROJEKT.name}`;
  await loadAll();
  document.getElementById("app").hidden = false;
  renderAll();
}
init();
</script>
