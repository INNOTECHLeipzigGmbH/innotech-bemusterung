async function saveEl(el, raumtypId, patch) {
  try { Object.assign(el, patch); await updateElement(el.id, raumtypId, patch); }
  catch (err) { alert("Speichern fehlgeschlagen: " + err.message); }
}
function buildGroupRow(it) {
  const { el, rt } = it;
  const row = document.createElement("div");
  row.className = `g-row is-neu-status-${el.status || "offen"}`;
  const startKey = groupKey(el);
  const c1 = document.createElement("div");
  c1.className = "g-rt";
  c1.innerHTML = `<b>${escHtml(rt.name || "(ohne Namen)")}</b>` + ((rt.raeume || []).length ? `<small>Räume: ${escHtml((rt.raeume || []).join(", "))}</small>` : "");
  row.appendChild(c1);
  const mk = (key, ph, cls) => {
    const inp = document.createElement("input");
    inp.placeholder = ph; inp.value = el[key] || ""; if (cls) inp.className = cls;
    inp.addEventListener("blur", () => {
      if (inp.value === (el[key] || "")) return;
      saveEl(el, rt.id, { [key]: inp.value });
      if (key !== "name") row.dataset.dirty = "1";
    });
    row.appendChild(inp);
  };
  mk("name", "Elementname", "g-name");
  mk("hersteller", "Hersteller"); mk("fabrikat", "Fabrikat"); mk("artikelnummer", "Artikelnummer");
  const st = document.createElement("select");
  st.className = `el-status-select s-${el.status || "offen"}`;
  STATUS_OPTS.forEach(o => { const op = document.createElement("option"); op.value = o.key; op.textContent = o.label; if ((el.status || "offen") === o.key) op.selected = true; st.appendChild(op); });
  st.addEventListener("change", () => {
    st.className = `el-status-select s-${st.value}`;
    row.className = `g-row is-neu-status-${st.value}`;
    saveEl(el, rt.id, { status: st.value }); renderKpis();
  });
  row.appendChild(st);
  // Wechselt das Element durch eine Aenderung die Gruppe, wird erst neu aufgebaut, wenn der Fokus die Zeile verlaesst
  row.addEventListener("focusout", e => {
    if (!row.dataset.dirty || row.contains(e.relatedTarget)) return;
    delete row.dataset.dirty;
    const moved = groupKey(el) !== startKey;
    setTimeout(() => { renderAll(); if (moved) showToast(`Element gehört jetzt zu „${groupLabelOf([{ el }]) || "(ohne Angabe)"}“`); }, 0);
  });
  return row;
}

/* ---------- Gemeinsam aendern ---------- */
const BULK_FIELDS = [["hersteller", "Hersteller"], ["fabrikat", "Fabrikat"], ["artikelnummer", "Artikelnummer"], ["status", "Status"], ["status_notiz", "Freigabe-Bemerkung"]];
const statusLabelOf = k => (STATUS_OPTS.find(o => o.key === k) || { label: k }).label;
const normVal = v => (v == null ? "" : String(v)).trim();

function showUndoToast(msg, onUndo) {
  const t = document.createElement("div");
  t.className = "toast";
  t.appendChild(document.createTextNode(msg));
  const b = document.createElement("button");
  b.type = "button"; b.className = "undo"; b.textContent = "Rückgängig";
  b.addEventListener("click", async () => { b.disabled = true; try { await onUndo(); } finally { t.remove(); } });
  t.appendChild(b);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 25000);
}

function openBulkDialog(items, title) {
  const bg = document.createElement("div");
  bg.className = "modal-bg bulk-dialog";
  const modal = document.createElement("div");
  modal.className = "modal";
  modal.innerHTML = `<div class="modal-head"><h3>Alle ändern – ${escHtml(title)}</h3></div>`;
  const body = document.createElement("div");
  body.className = "modal-body";
  modal.appendChild(body);

  // 1) betroffene Elemente
  const secList = document.createElement("div");
  secList.className = "bulk-sec";
  secList.innerHTML = `<h4>Betroffene Elemente <span class="pf-links"><a data-a="all">alle</a> · <a data-a="none">keine</a></span></h4>`;
  const list = document.createElement("div");
  list.className = "bulk-list";
  const checks = items.map(it => {
    const lab = document.createElement("label");
    lab.className = "copy-opt";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = true;
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(` ${it.rt.name || "(ohne Namen)"} – ${it.el.name || "(ohne Namen)"}`));
    const hint = document.createElement("span");
    hint.className = "copy-hint"; hint.textContent = [it.el.hersteller, it.el.fabrikat, it.el.artikelnummer].filter(Boolean).join(" · ") || "–";
    lab.appendChild(hint);
    list.appendChild(lab);
    return cb;
  });
  secList.appendChild(list);
  secList.querySelectorAll("a").forEach(a => a.addEventListener("click", () => { checks.forEach(c => { c.checked = a.dataset.a === "all"; }); update(); }));
  body.appendChild(secList);

  // 2) neue Werte (nur angehakte Felder werden geaendert)
  const secVals = document.createElement("div");
  secVals.className = "bulk-sec";
  secVals.innerHTML = `<h4>Neue Werte – nur angehakte Felder werden geändert</h4>`;
  const ctrls = {};
  BULK_FIELDS.forEach(([key, label]) => {
    const r = document.createElement("div");
    r.className = "bulk-row";
    const chg = document.createElement("input");
    chg.type = "checkbox"; chg.title = "dieses Feld ändern";
    const lb = document.createElement("span"); lb.textContent = label;
    let ctrl;
    const distinct = new Set(items.map(i => key === "status" ? (i.el.status || "offen") : normKey(i.el[key])));
    if (key === "status") {
      ctrl = document.createElement("select");
      STATUS_OPTS.forEach(o => ctrl.appendChild(new Option(o.label, o.key)));
      if (distinct.size === 1) ctrl.value = [...distinct][0];
      ctrl.addEventListener("change", () => { chg.checked = true; update(); });
    } else {
      ctrl = document.createElement("input");
      ctrl.type = "text";
      if (distinct.size === 1) ctrl.value = mostCommon(items.map(i => normVal(i.el[key])).filter(Boolean)); else ctrl.placeholder = "(unterschiedlich)";
      ctrl.addEventListener("input", () => { chg.checked = true; update(); });
    }
    chg.addEventListener("change", update);
    r.append(chg, lb, ctrl);
    secVals.appendChild(r);
    ctrls[key] = { chg, ctrl };
  });
  body.appendChild(secVals);

  const preview = document.createElement("div");
  preview.className = "bulk-preview";
  body.appendChild(preview);

  const foot = document.createElement("div");
  foot.className = "modal-foot";
  const msg = document.createElement("span"); msg.className = "crop-hint";
  const cancel = document.createElement("button"); cancel.type = "button"; cancel.className = "hbtn"; cancel.textContent = "Abbrechen";
  const ok = document.createElement("button"); ok.type = "button"; ok.className = "hbtn hbtn-blue"; ok.textContent = "Änderungen übernehmen"; ok.disabled = true;
  foot.append(msg, cancel, ok);
  modal.appendChild(foot);
  bg.appendChild(modal);
  document.body.appendChild(bg);

  function wanted() {
    const w = {};
    BULK_FIELDS.forEach(([key]) => {
      const { chg, ctrl } = ctrls[key];
      if (!chg.checked) return;
      w[key] = key === "status" ? ctrl.value : (normVal(ctrl.value) === "" ? null : normVal(ctrl.value));
    });
    return w;
  }
  function plan() {
    const w = wanted();
    const sel = items.filter((_, i) => checks[i].checked);
    const jobs = [];
    sel.forEach(it => {
      const patch = {}, prev = {};
      Object.keys(w).forEach(k => {
        const oldV = it.el[k] == null ? (k === "status" ? "offen" : null) : it.el[k];
        if (normVal(oldV) !== normVal(w[k])) { patch[k] = w[k]; prev[k] = it.el[k] == null ? null : it.el[k]; }
      });
      if (Object.keys(patch).length) jobs.push({ it, patch, prev });
    });
    return { w, sel, jobs };
  }
  function update() {
    const { w, sel, jobs } = plan();
    const rts = new Set(jobs.map(j => j.it.rt.id)).size;
    const bits = Object.keys(w).map(k => {
      const label = BULK_FIELDS.find(f => f[0] === k)[1];
      const v = w[k] == null ? "(leer)" : (k === "status" ? statusLabelOf(w[k]) : `„${w[k]}“`);
      return `${label} → <b>${escHtml(v)}</b>`;
    });
    if (!Object.keys(w).length) preview.textContent = "Noch kein Feld zum Ändern angehakt.";
    else if (!sel.length) preview.textContent = "Kein Element ausgewählt.";
    else if (!jobs.length) preview.textContent = "Mit diesen Werten würde sich nichts ändern.";
    else preview.innerHTML = `<b>${plural(jobs.length, "Element wird", "Elemente werden")}</b> in ${plural(rts, "Raumtyp", "Raumtypen")} geändert` + (sel.length > jobs.length ? ` (${sel.length - jobs.length} ausgewählte haben bereits diese Werte)` : "") + `:<br>${bits.join(" · ")}`;
    ok.disabled = !jobs.length;
    ok.textContent = jobs.length ? `${jobs.length} ${jobs.length === 1 ? "Element" : "Elemente"} ändern` : "Änderungen übernehmen";
  }
  checks.forEach(c => c.addEventListener("change", update));
  update();

  const close = () => { document.removeEventListener("keydown", onKey); bg.remove(); };
  const onKey = e => { if (e.key === "Escape" && !ok.dataset.busy) close(); };
  document.addEventListener("keydown", onKey);
  bg.addEventListener("mousedown", e => { if (e.target === bg && !ok.dataset.busy) close(); });
  cancel.addEventListener("click", () => { if (!ok.dataset.busy) close(); });

  ok.addEventListener("click", async () => {
    const { jobs } = plan();
    if (!jobs.length) return;
    ok.dataset.busy = "1"; ok.disabled = true; cancel.disabled = true;
    const done = []; let failed = 0, firstErr = null, next = 0;
    async function worker() {
      while (next < jobs.length) {
        const j = jobs[next++];
        msg.textContent = `Speichere … (${done.length + failed + 1}/${jobs.length})`;
        try { await updateElement(j.it.el.id, j.it.rt.id, j.patch); done.push(j); }
        catch (err) { failed++; firstErr = firstErr || err; }
      }
    }
    await Promise.all(Array.from({ length: Math.min(5, jobs.length) }, worker));
    delete ok.dataset.busy;
    close();
    // Filter auf die neue Gruppe mitziehen, wenn Fabrikat/Hersteller/Art.-Nr. geaendert wurden
    if (FILTER.fab !== null && done.length) {
      const keys = new Set(done.map(j => groupKey(j.it.el)));
      FILTER.fab = keys.size === 1 ? [...keys][0] : null;
    }
    renderAll();
    if (failed) alert(`${done.length} von ${jobs.length} Elementen geändert, ${failed} Fehler: ${firstErr && firstErr.message}`);
    if (done.length) {
      showUndoToast(`✓ ${plural(done.length, "Element", "Elemente")} geändert`, async () => {
        let bad = 0;
        for (const j of done) { try { await updateElement(j.it.el.id, j.it.rt.id, j.prev); } catch (e) { bad++; } }
        renderAll();
        showToast(bad ? `Rückgängig: ${bad} Fehler` : "✓ Änderung rückgängig gemacht");
      });
    }
  });
}

/* ---------- Init ---------- */
async function init() {
  wireAddRaumtypButton();
  wireFilterBar();
  document.getElementById("print-btn").addEventListener("click", () => { if (PROJEKT) openPrintDialog(); });
  PROJEKT = await resolveProjekt();
  if (!PROJEKT) return;
  document.getElementById("proj-label").textContent = `${PROJEKT.projektnummer ? PROJEKT.projektnummer + " · " : ""}${PROJEKT.name}`;
  document.title = `Bemusterungsliste – ${PROJEKT.name}`;
  await loadAll();
  document.getElementById("app").hidden = false;
  renderAll();
}
init();
</script>
